
services:
  # SonarQube for code quality analysis
  sonarqube:
    image: sonarqube:lts-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_ext:/opt/sonarqube/extensions

  # PostgreSQL database
  db:
    image: postgres:15-alpine
    container_name: eventpro-db
    environment:
      POSTGRES_DB: ${DB_NAME:-eventpro}
      POSTGRES_USER: ${DB_USER:-eventpro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-eventpro}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eventpro} -d ${DB_NAME:-eventpro}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Spring Boot application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${DOCKER_IMAGE:-eventpro-api}:${TAG:-latest}
    container_name: eventpro-app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-eventpro}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-eventpro}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-eventpro}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8081
    restart: unless-stopped

volumes:
  sonar_data:
  sonar_logs:
  sonar_ext:
  pgdata:
